<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<script src="theme-init.js"></script>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="top">
  <div class="stage">

    <div class="device">
      <img class="vita-image" src="vita-console.png" alt="PlayStation Vita" width="1166" height="569">
      <div class="screen">
        <h1>VITA FEED</h1>
        <div class="sp theme-p">
          <span class="lbl">Theme</span>
          <div class="swbox">
            <button class="sw" type="button" data-themeswitch role="switch" aria-checked="true" aria-label="Dark mode">
              <span class="ico sun">&#9728;</span><span class="ico moon">&#9790;</span><i></i>
            </button>
          </div>
        </div>
        <div class="sp browse-p">
          <span class="lbl">Browse select</span>
          <button class="tabbtn" type="button" data-tab="feed" aria-pressed="true">Reddit feed</button>
          <button class="tabbtn" type="button" data-tab="tracker" aria-pressed="false">Ports tracker</button>
        </div>
      </div>
    </div>

    <div class="wrap" id="panelwrap">
      <div class="panel" id="panel">

        <div class="mnav" role="group" aria-label="Views and theme">
          <button class="tabbtn" type="button" data-tab="feed" aria-pressed="true">Reddit feed</button>
          <button class="tabbtn" type="button" data-tab="tracker" aria-pressed="false">Ports tracker</button>
          <span class="swbox"><button class="sw" type="button" data-themeswitch role="switch" aria-checked="true" aria-label="Dark mode"><span class="ico sun">&#9728;</span><span class="ico moon">&#9790;</span><i></i></button></span>
        </div>

        <div id="feedView">
          <div class="bar" id="subs" role="group" aria-label="Subreddits"></div>
          <div class="bar" id="tags" role="group" aria-label="Topic filters"></div>
          <div class="bar controls">
            <input type="search" id="q" placeholder="Search titles" aria-label="Search titles">
            <select id="sort" aria-label="Sort order"><option value="new">Newest first</option><option value="score">Top score</option><option value="comments">Most comments</option></select>
            <label><input type="checkbox" id="onlyNews"> Only app / port / game posts</label>
            <span class="sep"></span>
            <button class="chip" id="refresh" type="button">Refresh</button>
          </div>
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <main id="list"></main>
        </div>

        <section id="trackerView" hidden>
          <p class="lead">Search the PS Vita Ports Tracker [Official], live from Google Sheets.</p>
          <div class="bar tbar">
            <input type="search" id="tq" placeholder="Search games, platforms, notes, verifier" aria-label="Search the ports tracker">
            <select id="tplat" aria-label="Original platform"><option value="">All platforms</option></select>
            <select id="tstage" aria-label="Development stage"><option value="">All stages</option></select>
            <select id="tplay" aria-label="Playability status"><option value="">All statuses</option></select>
            <select id="tsort" aria-label="Sort order"><option value="sheet">Sheet order</option><option value="name">Name A&ndash;Z</option><option value="date">Recently verified</option></select>
          </div>
          <div id="tcount" role="status" aria-live="polite">Loading the tracker&hellip;</div>
          <div id="tlist"></div>
          <button class="chip" id="tmore" type="button" hidden>Show more</button>
          <details id="sheetDetails">
            <summary>Show the full sheet</summary>
            <p>If it doesn't load below, <a id="sheetLink" target="_blank" rel="noopener noreferrer">open it in a new tab</a>.</p>
            <iframe id="sheetFrame" title="PS Vita Ports Tracker" loading="lazy"></iframe>
          </details>
        </section>

      </div>
    </div>

  </div>
</div>
<script src="app.js"></script>
</body>
</html>
