.bar{margin:0 0 6px;padding:8px 8px 2px;background:#121a25;border-radius:4px}

.post a.t{display:block;color:#f6f7fb;font-weight:600;text-decoration:none}
.meta{margin-top:5px;font-size:13px;color:#d3d8e4}
.sub{font-weight:700}

.tag.ok{background:#2d765f;color:#c3f5e2}
.tag.wip{background:#815f2a;color:#ffe3a8}
a.getbtn{display:inline-block;margin:7px 8px 0 0;padding:5px 11px;border-radius:3px;background:#2d353f;color:#7cc8ff;font-size:14px;text-decoration:none}

  function load() {

        try { data = JSON.parse(x.responseText); } catch (e) { data = null; }
      }
      if (data && data.posts) { posts = data.posts; updated = data.updated || 0; shown = PAGE; render(); }
      else { $("status").innerHTML = "Could not load posts. Press Refresh to try again."; }
    };
    x.send(null);
  }

  $("q").onkeyup = function () { shown = PAGE; render(); };
  $("topic").onchange = function () { shown = PAGE; render(); };

        play: get(rows[r], col.play), notes: get(rows[r], col.notes), proof: get(rows[r], col.proof), by: get(rows[r], col.by), date: get(rows[r], col.date) };
